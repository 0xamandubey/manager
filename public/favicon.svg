<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A281C" />
      <stop offset="100%" stop-color="#241911" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D082" />
      <stop offset="50%" stop-color="#B08A4A" />
      <stop offset="100%" stop-color="#846226" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="512" height="512" rx="140" fill="url(#bg-grad)" />
  
  <!-- Elegant Border -->
  <rect x="12" y="12" width="488" height="488" rx="128" fill="none" stroke="url(#gold-grad)" stroke-width="8" opacity="0.3" />
  
  <!-- Monogram 'M' group with drop shadow -->
  <g filter="url(#shadow)">
    <!-- Left vertical bar -->
    <rect x="128" y="160" width="48" height="192" rx="20" fill="url(#gold-grad)" />
    <!-- Right vertical bar -->
    <rect x="336" y="160" width="48" height="192" rx="20" fill="url(#gold-grad)" />
    <!-- Diagonal connector lines forming an M/Checkmark -->
    <path d="M 152,192 L 256,296 L 360,192" fill="none" stroke="url(#gold-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Golden checkmark status dot -->
    <circle cx="360" cy="128" r="20" fill="url(#gold-grad)" />
  </g>
</svg>